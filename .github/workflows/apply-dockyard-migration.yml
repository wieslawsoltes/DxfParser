name: Apply verified Dockyard migration
on:
  push:
    branches: [feat/dockyard-workspace]
    paths: [.github/workflows/apply-dockyard-migration.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dockyard-workspace
      - name: Apply verified narrow-pane follow-up
        run: |
          echo '8410fadd6c15b2752df5ab87ba5d4022076029ba0e3c691f0c2d8bc2e8446cdc  .dockyard-polish.patch' | sha256sum -c -
          git apply --check .dockyard-polish.patch
          git apply --index .dockyard-polish.patch
          rm .dockyard-polish.patch
          git add -A
          cp .git/index /tmp/dockyard-verification-index
          GIT_INDEX_FILE=/tmp/dockyard-verification-index git rm --cached .github/workflows/apply-dockyard-migration.yml .github/workflows/dockyard-bootstrap.yml
          ACTUAL="$(GIT_INDEX_FILE=/tmp/dockyard-verification-index git write-tree)"
          echo "Final repository tree after workflow cleanup: $ACTUAL"
          test "$ACTUAL" = '0337da984993d0fe5efd130241f75c50a06c98d4'
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          node --check components/tree-data-grid.js
          node --check components/docking-parser.js
      - name: Commit verified source to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve readable tree columns in narrow dock panes'
          git push origin HEAD:feat/dockyard-workspace
