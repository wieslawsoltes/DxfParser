name: Stage Skia renderer
on:
  push:
    branches: [feat/skia-dxf-renderer]
    paths: [.github/workflows/stage-skia-renderer.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wieslawsoltes/SkiaSharpWeb
          ref: 1f26ba6e5ab8731bdbd08d18a45e65c9763a57d3
          path: .skia-source
          persist-credentials: false
      - name: Archive pinned source trees
        run: |
          mkdir -p /tmp/skia-source/{DxfParser,SkiaSharpWeb}
          git archive HEAD | tar -x -C /tmp/skia-source/DxfParser
          git -C .skia-source archive HEAD | tar -x -C /tmp/skia-source/SkiaSharpWeb
          tar -czf /tmp/skia-source.tar.gz -C /tmp/skia-source .
      - uses: actions/upload-artifact@v4
        with:
          name: skia-renderer-source
          path: /tmp/skia-source.tar.gz
          retention-days: 3
