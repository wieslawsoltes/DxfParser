name: Apply verified GridWeb migration
on:
  push:
    branches: [feat/gridweb-document-previews]
    paths: [.github/workflows/apply-gridweb-migration.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gridweb-document-previews
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode and verify reviewed source patch
        run: |
          python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          chunks = sorted(Path('.gridweb-migration').glob('*.b64'))
          assert [p.name for p in chunks] == ['00.b64','01.b64','02.b64','03.b64','04.b64']
          encoded = ''.join(p.read_text().strip() for p in chunks)
          assert len(encoded) == 40060
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 117111
          assert hashlib.sha256(patch).hexdigest() == '8415f1ef456cb7818667df169cac8af6251d60abd62fd973e3b214901b7f86e9'
          Path('/tmp/gridweb-migration.patch').write_bytes(patch)
          PY
      - name: Apply sources and verify final repository tree
        run: |
          git apply --check /tmp/gridweb-migration.patch
          git apply --index /tmp/gridweb-migration.patch
          node scripts/build-rendering-bundle.js
          rm -rf .gridweb-migration
          git add -A
          cp .git/index /tmp/gridweb-verification-index
          GIT_INDEX_FILE=/tmp/gridweb-verification-index git rm --cached .github/workflows/stage-gridweb-migration.yml .github/workflows/vendor-office-controls.yml .github/workflows/apply-gridweb-migration.yml
          ACTUAL="$(GIT_INDEX_FILE=/tmp/gridweb-verification-index git write-tree)"
          echo "Final tree after temporary workflow cleanup: $ACTUAL"
          test "$ACTUAL" = '039b332140a874b1a0151ba5f1402ec2e8388414'
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          for file in components/data-grid.js components/tabular-reports.js components/office-preview.js components/batch-data-grid.js scripts/build-office-controls.mjs; do node --check "$file"; done
      - name: Commit verified sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: migrate reports and Office previews to GridWeb and RichTextWeb'
          git push origin HEAD:feat/gridweb-document-previews
