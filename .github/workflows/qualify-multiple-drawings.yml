name: Qualify multiple drawing views
on:
  push:
    branches: [work/multiple-drawings]
permissions:
  contents: write
concurrency:
  group: qualify-multiple-drawings
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize drawing views on work branch
        run: |
          set -euo pipefail
          for patch in scripts/multiple-drawings-fix*.patch; do
            test -f "$patch" || continue
            git apply --check --recount "$patch"
            git apply --recount "$patch"
            rm "$patch"
          done
          node scripts/build-rendering-bundle.js
          git add components packages dist docs scripts tests styles.css index.html README.md .github/workflows
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(rendering): select tiled drawings and guard source-owned lifetimes'
            git push origin HEAD:work/multiple-drawings
          fi
          mkdir -p test-results/qualification
          git rev-parse HEAD HEAD^{tree} > test-results/qualification/tested-source.txt
          git archive HEAD --format=tar.gz -o /tmp/multiple-drawings-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: multiple-drawings-source
          path: /tmp/multiple-drawings-source.tar.gz
          retention-days: 7
      - name: Comparison and analysis models
        run: node --test packages/dxf-compare/tests/*.test.js tests/analysis-visual-model.test.cjs 2>&1 | tee test-results/qualification/models.log
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test tooling
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
          npm install -g typescript@5.8.3
      - name: Native and package regression
        if: '!cancelled()'
        run: python -u tests/check-docking-regressions.py 2>&1 | tee test-results/qualification/native.log
      - name: Multiple drawing browser workflows
        if: '!cancelled()'
        run: timeout 360s python -u tests/multiple-drawings.py 2>&1 | tee test-results/qualification/multiple-drawings.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiple-drawings-browser-evidence
          path: test-results/
          retention-days: 7
      - name: Comparison browser workflows
        if: '!cancelled()'
        run: timeout 300s python -u tests/visual-compare.py 2>&1 | tee test-results/qualification/compare-browser.log
      - name: Native renderer browser regression
        if: '!cancelled()'
        run: timeout 300s python -u tests/skia-workspace.py 2>&1 | tee test-results/qualification/skia-browser.log
      - name: Retained workspace regression
        if: '!cancelled()'
        run: |
          failed=0
          for suite in workspace-startup docking-workspace gridweb-previews ribbon-workspace analysis-views analysis-visuals; do
            timeout 180s python -u tests/$suite.py 2>&1 | tee test-results/qualification/$suite.log || failed=1
          done
          exit $failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiple-drawings-full-qualification
          path: test-results/
          retention-days: 14
