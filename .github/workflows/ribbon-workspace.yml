name: RibbonWeb and dock documents
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ribbon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: Native RibbonWeb and document lifetime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify local RibbonWeb and integration syntax
        run: |
          (cd vendor/ribbonweb && sha256sum -c SHA256SUMS)
          for file in components/ribbon-workspace.mjs components/docking-documents.js components/docking-parser.js components/docking-editor.js components/docking-workspace.js components/tree-data-grid.js components/state-manager.js components/app.js; do node --check "$file"; done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser tools
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Test native HTTP modules, ribbon commands and retained documents
        run: python tests/ribbon-workspace.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ribbon-document-browser-evidence
          path: test-results/ribbon
          retention-days: 14
