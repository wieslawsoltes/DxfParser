name: Stage RibbonWeb workspace
on:
  push:
    branches: [feat/ribbon-document-workspace]
    paths: [.github/workflows/stage-ribbon-workspace.yml]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wieslawsoltes/RibbonWeb
          ref: d4f8f53c038e7b21e5942c8084eae211d3d4e4a1
          path: .ribbon-upstream
      - name: Archive exact sources
        run: |
          mkdir -p /tmp/ribbon-workspace/DxfParser /tmp/ribbon-workspace/RibbonWeb
          git archive HEAD | tar -x -C /tmp/ribbon-workspace/DxfParser
          git -C .ribbon-upstream archive HEAD | tar -x -C /tmp/ribbon-workspace/RibbonWeb
          tar -czf /tmp/ribbon-workspace.tar.gz -C /tmp/ribbon-workspace .
      - uses: actions/upload-artifact@v4
        with:
          name: ribbon-workspace-sources
          path: /tmp/ribbon-workspace.tar.gz
          retention-days: 3
