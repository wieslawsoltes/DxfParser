name: Stage GridWeb migration
on:
  push:
    branches: [feat/gridweb-document-previews]
    paths: [.github/workflows/stage-gridweb-migration.yml]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wieslawsoltes/GridWeb
          ref: 79fe32584e646a614a6549c8a14ea12e976b2e02
          path: .gridweb-source
      - uses: actions/checkout@v4
        with:
          repository: wieslawsoltes/RichTextWeb
          ref: 7f6242b6355b7448bf975a96f12aa18a161ea9a7
          path: .richtextweb-source
      - name: Archive exact sources
        run: |
          mkdir -p /tmp/grid-migration/{DxfParser,GridWeb,RichTextWeb}
          git archive HEAD | tar -x -C /tmp/grid-migration/DxfParser
          git -C .gridweb-source archive HEAD | tar -x -C /tmp/grid-migration/GridWeb
          git -C .richtextweb-source archive HEAD | tar -x -C /tmp/grid-migration/RichTextWeb
          tar -czf /tmp/grid-migration.tar.gz -C /tmp/grid-migration .
      - uses: actions/upload-artifact@v4
        with:
          name: grid-migration-sources
          path: /tmp/grid-migration.tar.gz
          retention-days: 3
