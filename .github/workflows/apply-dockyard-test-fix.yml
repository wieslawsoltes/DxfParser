name: Apply verified Dockyard browser tests
on:
  push:
    branches: [feat/dockyard-workspace]
    paths: [.github/workflows/apply-dockyard-test-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dockyard-workspace
      - name: Verify and apply browser test corrections
        run: |
          echo 'dd44c43be5b8baf6b16aa5fabb7e8b79f2a6b824ee184b00a92776090d5389ea  .dockyard-browser-fix.patch' | sha256sum -c -
          git apply --check .dockyard-browser-fix.patch
          git apply --index .dockyard-browser-fix.patch
          rm .dockyard-browser-fix.patch
          git add -A
          cp .git/index /tmp/dockyard-verification-index
          GIT_INDEX_FILE=/tmp/dockyard-verification-index git rm --cached .github/workflows/apply-dockyard-test-fix.yml
          ACTUAL="$(GIT_INDEX_FILE=/tmp/dockyard-verification-index git write-tree)"
          echo "Final repository tree after workflow cleanup: $ACTUAL"
          test "$ACTUAL" = 'f96e39566dae0be3817b3839bc06ad19f4eb3c94'
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          python -m py_compile tests/docking-workspace.py
      - name: Commit verified tests to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: validate composited pixels and pre-startup corrupt storage'
          git push origin HEAD:feat/dockyard-workspace
