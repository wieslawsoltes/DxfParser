name: Workspace first paint
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: startup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: No legacy UI during load or refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check startup coordinator syntax
        run: node --check scripts/workspace-startup.js
      - name: Install pinned browser tools
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Verify first paint, refresh, delayed dependencies and failure states
        run: python tests/workspace-startup.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-first-paint-evidence
          path: test-results/startup/
          retention-days: 14
