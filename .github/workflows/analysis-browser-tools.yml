name: Prepare analysis browser
on:
  push:
    branches: [feat/analysis-usability]
    paths: [.github/workflows/analysis-browser-tools.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare matching browser binary for offline tests
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install chromium --only-shell
          tar -cJf /tmp/analysis-chromium.tar.xz -C "$HOME/.cache/ms-playwright" chromium_headless_shell-1200
      - uses: actions/upload-artifact@v4
        with:
          name: analysis-chromium
          path: /tmp/analysis-chromium.tar.xz
          retention-days: 1
          compression-level: 0
