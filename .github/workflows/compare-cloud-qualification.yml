name: Compare cloud qualification
on:
  push:
    branches: [work/compare-cloud-groups]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive HEAD --format=tar.gz -o /tmp/compare-cloud-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: compare-cloud-source
          path: /tmp/compare-cloud-source.tar.gz
          retention-days: 3
