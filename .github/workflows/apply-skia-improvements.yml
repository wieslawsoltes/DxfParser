name: Apply verified Skia improvements
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-skia-improvements.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode and verify reviewed source patch
        run: |
          python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          chunks = sorted(Path('.skia-improvements').glob('*.b64'))
          assert [p.name for p in chunks] == [f'{i:02}.b64' for i in range(6)]
          encoded = ''.join(p.read_text().strip() for p in chunks)
          assert len(encoded) == 64464, len(encoded)
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 186465, len(patch)
          assert hashlib.sha256(patch).hexdigest() == '3db4fb50e479c73c240228e2a25342f22eeb8f20e6413da6561aa238545cd32c'
          Path('/tmp/skia-improvements.patch').write_bytes(patch)
          PY
      - name: Apply sources and deterministically regenerate native bridge and bundles
        run: |
          git apply --check /tmp/skia-improvements.patch
          git apply --index /tmp/skia-improvements.patch
          node scripts/patch-skia-webgpu-abi.mjs
          node scripts/build-rendering-bundle.js
          rm -rf .skia-improvements
          git add -A
          cp .git/index /tmp/skia-improvements-index
          GIT_INDEX_FILE=/tmp/skia-improvements-index git rm --cached .github/workflows/apply-skia-improvements.yml
          ACTUAL="$(GIT_INDEX_FILE=/tmp/skia-improvements-index git write-tree)"
          echo "Verified source tree before the permanent GPU CI update: $ACTUAL"
          test "$ACTUAL" = 'adfc906b7e3bb1e79905ff8e2cd9a41c25c72f18'
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
      - name: Verify native ABI, geometry, pixels and installed consumers
        run: |
          npm install --global typescript@5.8.3
          python tests/check-docking-regressions.py
      - name: Commit validated implementation directly to main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: repair native WebGPU ABI and complete renderer fidelity and recovery improvements' -m 'Preserve unsigned WASM draw arguments; scope GPU errors and recover once per backend without losing drawing resources. Add exact curve bounds/snaps, fit-spline interpolation, hatch islands and native gradients, nonrectangular viewport clips, dimension fallback semantics and backend controls. Includes regression tests, audited vendor patch provenance and updated compatibility documentation.'
          git push origin HEAD:main
