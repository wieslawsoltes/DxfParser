name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: Immutable source revision to qualify
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  models:
    name: Source, native renderer and package contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global typescript@5.8.3
      - run: python tests/run.py models
      - name: Check build and packaging did not modify tracked sources
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-and-package-evidence
          path: test-results/
          retention-days: 14
  browser:
    name: HTTP browser / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [workspace, analysis, drawings, gpu]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test dependencies
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Test the source-only checkout without generated distributions
        run: |
          test ! -e dist
          test ! -e packages/dxf-skia/dist
          xvfb-run -a python tests/run.py "${{ matrix.suite }}"
      - name: Verify static entry points did not need a build
        run: |
          test ! -e dist
          test ! -e packages/dxf-skia/dist
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.suite }}-evidence
          path: test-results/
          retention-days: 14
