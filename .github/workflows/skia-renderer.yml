name: Native Skia DXF renderer
on:
  pull_request:
  push:
    branches: [main, feat/skia-dxf-renderer]
permissions:
  contents: read
concurrency:
  group: skia-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    name: Native pixels, package and CAD interaction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out immutable performance and pixel reference
        uses: actions/checkout@v4
        with:
          ref: 1342c38a5fb7f1a0944c37fb989bf3cba52b2ebc
          path: .performance-reference
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned consumer and browser tooling
        run: |
          npm install --global typescript@5.8.3
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Verify compiler, native Skia pixels and packed consumers
        run: python tests/check-docking-regressions.py
      - name: Require native WebGPU and WebGL pipelines on SwiftShader
        run: xvfb-run -a python tests/skia-gpu.py
      - name: Compare native pixels and report CPU performance against 0.2.1
        run: node scripts/benchmark-skia.mjs .performance-reference
      - name: Require same-quality WebGPU performance and native cache reuse
        run: xvfb-run -a python tests/skia-performance-gpu.py
      - name: Verify real HTTP CAD renderer, exports and resource lifetime
        run: python tests/skia-workspace.py
      - name: Verify retained application workflows
        run: |
          python tests/docking-workspace.py
          python tests/ribbon-workspace.py
          python tests/gridweb-previews.py
          python tests/analysis-views.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-skia-renderer-evidence
          path: test-results/
          retention-days: 14
