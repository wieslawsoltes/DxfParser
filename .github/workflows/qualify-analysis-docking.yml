name: Qualify dockable analysis
on:
  push:
    branches: [work/analysis-docking-refactor]
permissions:
  contents: write
concurrency:
  group: qualify-analysis-docking
  cancel-in-progress: true
jobs:
  source:
    name: Materialize verified analysis refactor
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified refactor
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if test -f scripts/analysis-docking-fix.patch.xz; then
            xz -dc scripts/analysis-docking-fix.patch.xz > scripts/analysis-docking-fix.patch
            rm scripts/analysis-docking-fix.patch.xz
          fi
          if test -f scripts/analysis-docking-fix.patch; then
            git apply --check scripts/analysis-docking-fix.patch
            git apply scripts/analysis-docking-fix.patch
            rm scripts/analysis-docking-fix.patch
          fi
          git add components packages scripts tests README.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(analysis): validate native layout iterators and isolate test state'
            git push origin HEAD:work/analysis-docking-refactor
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive HEAD --format=tar.gz -o /tmp/analysis-docking-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: analysis-docking-source
          path: /tmp/analysis-docking-source.tar.gz
          retention-days: 7
  probe:
    name: Focused docked analysis browser evidence
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - shell: bash
        run: |
          mkdir -p test-results/probe
          timeout 150s python -u tests/analysis-docking.py -f 2>&1 | tee test-results/probe/standalone.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-docking-probe
          path: test-results/
          retention-days: 7
  validate:
    name: Validate dockable analysis and packages
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ needs.source.outputs.revision }}
    permissions:
      contents: read
