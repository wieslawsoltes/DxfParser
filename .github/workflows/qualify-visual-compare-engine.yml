name: Qualify native visual comparison
on:
  push:
    branches: [work/visual-compare-engine]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qualify-visual-compare
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/visual-compare-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize and publish implementation on work branch
        run: |
          set -euo pipefail
          if test -f scripts/visual-compare-fix.patch.xz; then
            xz -dc scripts/visual-compare-fix.patch.xz > /tmp/visual-compare-fix.patch
            echo 'f88bc9481e59f68e0a3017bdf3cb36c1be996e7f309544804a10b1ce9bb314b1  /tmp/visual-compare-fix.patch' | sha256sum -c -
            git apply --check /tmp/visual-compare-fix.patch
            git apply /tmp/visual-compare-fix.patch
            rm scripts/visual-compare-fix.patch.xz
          fi
          if test -f scripts/visual-compare-fix.patch; then
            git apply --check scripts/visual-compare-fix.patch
            git apply scripts/visual-compare-fix.patch
            rm scripts/visual-compare-fix.patch
          fi
          node scripts/build-rendering-bundle.js
          git add components packages dist docs scripts tests
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(compare): guard refreshed selection, binary sources and atomic import history'
            git push origin HEAD:work/visual-compare-engine
          fi
          mkdir -p test-results/qualification
          git rev-parse HEAD HEAD^{tree} > test-results/qualification/tested-source.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
          npm install -g typescript@5.8.3
      - name: Compare model and transaction tests
        run: node --test packages/dxf-compare/tests/*.test.js 2>&1 | tee test-results/qualification/compare.log
      - name: Native renderer and package qualification
        if: '!cancelled()'
        run: python tests/check-docking-regressions.py 2>&1 | tee test-results/qualification/native.log
      - name: Native compare browser workflows
        if: '!cancelled()'
        run: timeout 300s python -u tests/visual-compare.py 2>&1 | tee test-results/qualification/compare-browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-compare-browser-evidence
          path: test-results/
          retention-days: 7
      - name: Native renderer browser regression
        if: '!cancelled()'
        run: timeout 300s python -u tests/skia-workspace.py 2>&1 | tee test-results/qualification/skia-browser.log
      - name: Retained workspace and analysis regression
        if: '!cancelled()'
        run: |
          failed=0
          for suite in workspace-startup docking-workspace gridweb-previews ribbon-workspace analysis-views analysis-visuals; do
            timeout 180s python -u tests/$suite.py 2>&1 | tee test-results/qualification/$suite.log || failed=1
          done
          exit $failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-compare-qualification
          path: test-results/
          retention-days: 7
