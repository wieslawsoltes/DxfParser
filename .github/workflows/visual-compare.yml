name: Native DXF comparison
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: visual-compare-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic comparison and rendering bundles
        run: |
          node scripts/build-rendering-bundle.js
          git diff --exit-code -- dist packages/dxf-skia/dist
      - name: Qualify matching, transactions and real native category pixels
        run: |
          mkdir -p test-results/compare-qualification
          git rev-parse HEAD HEAD^{tree} > test-results/compare-qualification/tested-source.txt
          node --test packages/dxf-compare/tests/*.test.js 2>&1 | tee test-results/compare-qualification/engine.log
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser tooling
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Qualify native compare UI, snapshots, export and import history
        run: python -u tests/visual-compare.py 2>&1 | tee test-results/compare-qualification/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-compare-evidence
          path: |
            test-results/compare-qualification
            test-results/compare-native
            test-results/skia-browser
          retention-days: 14
